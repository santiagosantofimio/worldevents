// What every module has in common.
plugins {
	id 'java-library'
}

base {
	archivesName = "${archives_name}-${project.name}-${minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version)
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version as int
}

def licenseSuffix = mod_id
tasks.withType(Jar).configureEach {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${licenseSuffix}" }
	}
}

processResources {
	var properties = [
			'version'                      : version,
			'mod_id'                       : mod_id,
			'mod_name'                     : mod_name,
			'mod_author'                   : mod_author,
			'license'                      : license,
			'description'                  : mod_description,
			'minecraft_version_range'      : minecraft_version_range,
			'fabric_loader_version'        : fabric_loader_version,
			'neoforge_version'             : neoforge_version,
			'neoforge_loader_version_range': neoforge_loader_version_range,
			'forge_version_range'          : forge_version_range,
	]
	inputs.properties(properties)
	filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
		expand(properties)
	}
}
