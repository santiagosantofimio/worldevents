// Forge for 1.16.5 is a build of its own. It uses Architectury Loom: Forge 1.16.5's own toolchain only has Mojang's
// names for methods and fields, not for classes, and the shared code in ../common is written with all of them.
pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		gradlePluginPortal()
	}
}

rootProject.name = 'worldevents-forge-1.16.5'
