org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false

# Shared by every loader
minecraft_version=1.16.5
java_version=17
# The jars are compiled with Java 17 and then turned into Java 8 classes (JvmDowngrader), which 1.16.5 runs on.
java_runtime_version=8
jvmdg_version=2.0.1
version=1.0.0
group=dev.santiagosantofimio
# Resource pack format of minecraft_version (version.json "pack_version.resource_major" in the client jar)
resource_pack_format=6
# Data pack format of minecraft_version (version.json "pack_version.data_major")
data_pack_format=6
junit_version=5.13.4

# Fabric (https://fabricmc.net/develop)
loader_version=0.19.5
loom_version=1.14.10
fabric_api_version=0.42.0+1.16


# Forge (https://files.minecraftforge.net)
forge_version=1.16.5-36.2.42
forgegradle_version=7.0.40
# ForgeGradle: run the game with classes and resources as one module, as in the MDK
net.minecraftforge.gradle.merge-source-sets=true
