def javaVersion = project.java_version as int

subprojects {
	version = rootProject.version
	group = rootProject.group

	plugins.withId('java') {
		base {
			archivesName = "worldomens-${project.name}-${project.minecraft_version}"
		}

		java {
			toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
			withSourcesJar()
		}

		sourceSets {
			main {
				java.srcDir(rootProject.file('common/src/main/java'))
				resources.srcDir(rootProject.file('common/src/main/resources'))
			}
			if (project.name == 'fabric') {
				test {
					java.srcDir(rootProject.file('common/src/test/java'))
				}
			}
		}

		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.release = javaVersion
			options.compilerArgs += ['-Xmaxerrs', '1000']
		}

		dependencies {
			testImplementation platform("org.junit:junit-bom:${project.junit_version}")
			testImplementation 'org.junit.jupiter:junit-jupiter'
			testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		}

		test {
			useJUnitPlatform()
		}

		jar {
			from(rootProject.file('../../LICENSE')) {
				rename { "${it}_worldomens" }
			}
		}
	}
}

def resourcePackFormat = project.resource_pack_format as int
def modVersion = project.version
def mcVersion = project.minecraft_version
tasks.register("resourcePack", Zip) {
	group = "build"
	description = "Builds the optional resource pack and its SHA-1 for server.properties."
	archiveFileName = "worldomens-${modVersion}+${mcVersion}-resourcepack.zip"
	destinationDirectory = layout.buildDirectory.dir("libs")
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	inputs.property("format", resourcePackFormat)
	from("common/src/resourcepack") {
		filesMatching("pack.mcmeta") {
			expand("format": resourcePackFormat)
		}
	}
	from("common/src/main/resources/assets") {
		into("assets")
		exclude("worldomens/icon.png")
	}
	from("common/src/main/resources/assets/worldomens/icon.png") {
		rename { "pack.png" }
	}
	def zipFile = archiveFile
	doLast {
		def file = zipFile.get().asFile
		def sha1 = java.security.MessageDigest.getInstance("SHA-1").digest(file.bytes).encodeHex().toString()
		new File(file.path + ".sha1").text = sha1 + "\n"
		logger.lifecycle("Resource pack: ${file.name} (sha1 ${sha1})")
	}
}

apply plugin: 'java-base'
def forgeJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.java_version as int) }
def forgeBuild = tasks.register("forgeBuild", Exec) {
	group = "build"
	description = "Builds the Forge jar with its own Gradle build in forge/."
	workingDir = file("forge")
	def windows = System.getProperty("os.name").toLowerCase().contains("windows")
	commandLine = windows ? ["cmd", "/c", "gradlew.bat", "build", "--no-daemon", "-q"] : ["./gradlew", "build", "--no-daemon", "-q"]
	doFirst {
		environment("JAVA_HOME", forgeJava.get().metadata.installationPath.asFile.absolutePath)
	}
}

def distVersion = project.minecraft_version
def distModVersion = project.version
tasks.register("dist", Sync) {
	group = "build"
	description = "Builds every loader's jar and the resource pack into dist/${distVersion}."
	dependsOn("resourcePack", forgeBuild)
	subprojects.each { sub ->
		dependsOn("${sub.path}:assemble")
		from(sub.layout.buildDirectory.dir("libs")) {
			include("worldomens-${sub.name}-${distVersion}-${distModVersion}.jar")
		}
	}
	from("forge/build/libs") {
		include("worldomens-forge-${distVersion}-${distModVersion}.jar")
	}
	from(layout.buildDirectory.dir("libs")) {
		include("worldomens-${distModVersion}+${distVersion}-resourcepack.zip", "worldomens-${distModVersion}+${distVersion}-resourcepack.zip.sha1")
	}
	into(rootProject.file("../../dist/${distVersion}"))
}
