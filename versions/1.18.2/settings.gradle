pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'worldevents-1.18.2'
include 'fabric'
// Forge is a build of its own (forge/): ForgeGradle 6, which 1.18 needs, runs on Gradle 8.
