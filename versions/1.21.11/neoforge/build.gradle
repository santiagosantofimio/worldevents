plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

neoForge {
	version = project.neoforge_version
	accessTransformers = files(rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg'))

	runs {
		server {
			server()
			programArgument '--nogui'
		}
		client {
			client()
		}
	}

	mods {
		worldevents {
			sourceSet(sourceSets.main)
		}
	}
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version, neoforge_version: project.neoforge_version]
	inputs.properties props
	filesMatching("META-INF/neoforge.mods.toml") {
		expand props
	}
}
