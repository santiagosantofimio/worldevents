plugins {
	id 'java'
	id 'net.minecraftforge.gradle' version "${forgegradle_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
		}
		register('client') {
			args '--mixin.config', 'worldevents.mixins.json'
		}
		register('server') {
			args '--nogui', '--mixin.config', 'worldevents.mixins.json'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${project.forge_version}") {
		accessTransformers.from(rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg'))
	}
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

jar {
	manifest.attributes('MixinConfigs': 'worldevents.mixins.json')
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version, forge_version: project.forge_version.split('-')[1],
			data_format: project.data_pack_format]
	inputs.properties props
	filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
		expand props
	}
}
