modLoader = "javafml"
loaderVersion = "[${forge_version},)"
license = "MIT"
issueTrackerURL = "https://github.com/santiagosantofimio/worldomens/issues"

[[mods]]
modId = "worldomens"
version = "${version}"
displayName = "World Omens"
authors = "Santiago Santofimio"
displayURL = "https://github.com/santiagosantofimio/worldomens"
logoFile = "assets/worldomens/icon.png"
description = '''
Random world events for servers, with their own creatures and bosses: blood moons, meteor showers, hordes, treasure hunts, Nether eruptions and more. Server-side only: vanilla clients can join.
'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.worldomens]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.worldomens]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},26.2)"
ordering = "NONE"
side = "BOTH"
